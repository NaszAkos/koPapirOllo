<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kő papír olló</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div>

            <h1>Kő - Papír - Olló</h1>
        </div>
        <div>
            <form>
                <label for="email">E-mail cím: </label>
                <input type="text" id="email">
                <label for="jatekosNev">Játékos neve: </label>
                <input type="text" id="jatekosNev">
                <button type="button" onclick="ellenorzes()">Mentés</button>
            </form>
            
        </div>
        <div>
            <p id="hibaUzenet"></p>
        </div>
        <div>

            <h2>Válassz!</h2>
        </div>
        <div id="kepek">
            <img src="img/ko.png" alt="" id="ko" onclick="jatek('ko')">
            <img src="img/papir.png" alt="" id="papir" onclick="jatek('papir')">
            <img src="img/ollo.png" alt="" id="ollo" onclick="jatek('ollo')">
        </div>

        <div>
            <h2>Gép választása</h2>
            <img src="img/ollo.png" alt="" id="gepValasztasKep">
        </div>
        <div>
            <button onclick="ujrakezdes()">Ujrakezdes</button>
        </div>
        <div >
            <h1 id="eredmenyH1">Eredmény: </h1>
            <h2 id="vegsoEredmeny"></h2>
        </div>
    
        <div id="pontok">
            <h3>Te pontod</h3>
            <p id="jatekosPontja">0</p>
            <h3>Gép pontja</h3>
            <p id="gepPontja">0</p>
        </div>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
